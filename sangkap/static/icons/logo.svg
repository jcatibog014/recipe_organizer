<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sangkap">
  <defs>
    <radialGradient id="bulb" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#fff1e4"/>
      <stop offset="1" stop-color="#f6d6c4"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ff0b8"/>
      <stop offset="1" stop-color="#3fbf7f"/>
    </linearGradient>
  </defs>
  <!-- soft shadow under the garlic -->
  <ellipse cx="32" cy="60" rx="17" ry="3" fill="#4a2c2a" opacity="0.15"/>
  <!-- the sprout on top -->
  <path d="M32 15 C31 10 28 6 23 4 C27 8 29 11 30 15Z" fill="url(#leaf)" stroke="#4a2c2a" stroke-width="2" stroke-linejoin="round"/>
  <path d="M32 15 C34 9 38 6 43 6 C39 9 36 12 34 16Z" fill="url(#leaf)" stroke="#4a2c2a" stroke-width="2" stroke-linejoin="round"/>
  <!-- the bulb -->
  <path d="M32 13 C19 18 9 30 12 43 C14 52 22 57 32 57 C42 57 50 52 52 43 C55 30 45 18 32 13Z"
        fill="url(#bulb)" stroke="#4a2c2a" stroke-width="3" stroke-linejoin="round"/>
  <!-- clove lines -->
  <path d="M26 20 C20 30 20 46 25 56" fill="none" stroke="#e7c3ae" stroke-width="2" stroke-linecap="round"/>
  <path d="M38 20 C44 30 44 46 39 56" fill="none" stroke="#e7c3ae" stroke-width="2" stroke-linecap="round"/>
  <!-- shine -->
  <ellipse cx="22" cy="28" rx="3.5" ry="6" fill="#ffffff" opacity="0.9" transform="rotate(20 22 28)"/>
  <!-- the face -->
  <ellipse cx="25" cy="40" rx="3" ry="3.6" fill="#4a2c2a"/>
  <ellipse cx="39" cy="40" rx="3" ry="3.6" fill="#4a2c2a"/>
  <circle cx="26.1" cy="38.6" r="1.1" fill="#ffffff"/>
  <circle cx="40.1" cy="38.6" r="1.1" fill="#ffffff"/>
  <ellipse cx="19.5" cy="46" rx="4" ry="2.4" fill="#ff8fb1" opacity="0.85"/>
  <ellipse cx="44.5" cy="46" rx="4" ry="2.4" fill="#ff8fb1" opacity="0.85"/>
  <path d="M29 45 Q32 48.5 35 45" fill="none" stroke="#4a2c2a" stroke-width="2.2" stroke-linecap="round"/>
  <!-- a little sparkle -->
  <path d="M53 14 L54.5 18 L58.5 19.5 L54.5 21 L53 25 L51.5 21 L47.5 19.5 L51.5 18Z" fill="#ffd95c" stroke="#4a2c2a" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
